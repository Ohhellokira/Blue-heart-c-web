<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I love you &lt;3 (WebAssembly)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; outline: none; }
  #startOverlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; z-index: 10; cursor: pointer; transition: opacity 0.6s ease;
  }
  #startOverlay.hidden { opacity: 0; pointer-events: none; }
  #startCard { text-align: center; font-family: Georgia, 'Times New Roman', serif; color: #ffd2dc; user-select: none; }
  #startHeart { font-size: 4.5rem; color: #ff9ab0; animation: pulse 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255, 150, 180, 0.65)); }
  #startCard p { margin-top: 0.75rem; font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #backLink { position: fixed; top: 10px; left: 12px; z-index: 11; font: 12px sans-serif; color: #ffb3c6;
    text-decoration: none; opacity: 0.6; }
  #backLink:hover { opacity: 1; }
</style>
</head>
<body>
<a id="backLink" href="../index.html">&larr; JS version</a>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<div id="startOverlay">
  <div id="startCard">
    <div id="startHeart">&#10084;</div>
    <p>tap to begin</p>
  </div>
</div>

<script>
var Module = {
  canvas: document.getElementById('canvas'),
  print: function(text) { console.log(text); },
  printErr: function(text) { console.error(text); },
};
</script>
{{{ SCRIPT }}}
<script>
  document.getElementById('startOverlay').addEventListener('click', function () {
    var ov = this;
    ov.classList.add('hidden');
    setTimeout(function () { ov.style.display = 'none'; }, 650);
    if (window.Module && Module.ccall) {
      try { Module.ccall('start_music', 'v', [], []); } catch (e) { console.error(e); }
    }
  }, { once: true });
</script>
</body>
</html>
